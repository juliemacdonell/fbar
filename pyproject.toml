[project]
name = "fbar"
version = "0.1.0"
description = "Generate FBAR maximum balance reports from YNAB accounts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prettytable",
    "pyyaml",
    "ynab==4.4.0",
]

[project.scripts]
fbar = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
